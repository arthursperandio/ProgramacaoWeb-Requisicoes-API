<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Atividade de Requisições API</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="src/css/style.css">
</head>

<body>

    <div class="container py-5">
        <h1 class="text-center mb-4">
            Publicaí
        </h1>
        <p class="text-center text-muted mb-4">
            Um espaço para ideias que merecem ser compartilhadas.
        </p>
        <div class="card shadow-sm mb-5">
            <div class="card-body">
                <h4 class="mb-3">
                    Nova Postagem
                </h4>
                <div class="mb-3">
                    <label class="form-label">
                        Título
                    </label>
                    <input type="text" name="title" class="form-control" placeholder="Digite o título">
                </div>
                <div class="mb-3">
                    <label class="form-label">
                        Conteúdo do Blog
                    </label>
                    <textarea name="body" class="form-control" rows="4" placeholder="Digite o conteúdo"></textarea>
                </div>
                <div id="mensagem"></div>
                <button id="btn-create" class="btn btn-primary">
                    Publicar
                </button>
            </div>
        </div>
        <div class="card shadow-sm">
            <div class="card-body">
                <button id="btn-load" class="btn btn-outline-secondary mb-3">
                    Carregar Postagens
                </button>
                <h4 class="mb-3">
                    Postagens
                </h4>
                <div class="table-responsive">
                    <table class="table table-striped table-hover align-middle">
                        <thead class="table-dark">
                            <tr>
                                <th>ID</th>
                                <th>Título</th>
                                <th>Conteúdo</th>
                                <th>Ações</th>
                            </tr>
                        </thead>
                        <tbody>
                        </tbody>
                    </table>
                </div>
            </div>
        </div>
    </div>

    <script src="src/app.js"></script>
</body>

</html>
